name: Release

on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:preflight
      - run: echo "Publishing remains manual until package names, provenance, and workspace package order are finalized."

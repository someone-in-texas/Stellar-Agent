name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or verify, for example vX.Y.Z"
        required: true
      create_github_release:
        description: "Create the GitHub release from generated artifacts"
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  actions: write
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@9.15.4 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:preflight
      - name: Create GitHub release
        if: github.event_name == 'push' || inputs.create_github_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            .release/artifacts/npm/*.tgz \
            .release/artifacts/codex/*.tgz \
            .release/artifacts/release-manifest.json \
            --title "Stellar Agent $RELEASE_TAG" \
            --notes-file .release/github-release-notes.md \
            --target "$GITHUB_SHA" \
            --verify-tag
      - name: Queue protected npm publish workflow
        if: github.event_name == 'push' || inputs.create_github_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run npm-publish.yml \
            --ref main \
            -f tag="$RELEASE_TAG" \
            -f dry_run=false
          echo "Queued protected Publish npm workflow for $RELEASE_TAG. Approve the npm-production environment to publish."

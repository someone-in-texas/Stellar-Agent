name: Live Testnet Smoke

on:
  workflow_dispatch:

jobs:
  live-testnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: LIVE_STELLAR_TESTNET=1 pnpm smoke:testnet

name: Publish npm

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.5.0"
        required: true
        default: "v0.4.0"
      dry_run:
        description: "Run npm publish dry-run only"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    environment: npm-production
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare pnpm@9.15.4 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:preflight
      - name: Publish npm packages
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            pnpm release:publish:npm:dry-run
          else
            pnpm release:publish:npm -- --skip-auth-check
          fi
      - name: Verify published npm versions
        if: env.DRY_RUN != 'true'
        run: |
          node - <<'NODE'
          const { readFileSync } = require("node:fs");
          const { execFileSync } = require("node:child_process");

          const attempts = Number(process.env.NPM_VERIFY_ATTEMPTS || 12);
          const delayMs = Number(process.env.NPM_VERIFY_DELAY_MS || 10000);
          const manifest = JSON.parse(readFileSync(".release/artifacts/release-manifest.json", "utf8"));
          const pending = new Map(manifest.npmPackages.map((pkg) => [`${pkg.name}@${pkg.version}`, pkg]));
          const lastErrors = new Map();

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          for (let attempt = 1; attempt <= attempts && pending.size > 0; attempt += 1) {
            for (const [label, pkg] of [...pending]) {
              try {
                const output = execFileSync("npm", ["view", `${pkg.name}@${pkg.version}`, "version", "--json"], {
                  encoding: "utf8"
                }).trim();
                if (JSON.parse(output) !== pkg.version) {
                  throw new Error(`npm returned ${output}`);
                }
                pending.delete(label);
                lastErrors.delete(label);
                console.log(`${label} is visible on npm.`);
              } catch (error) {
                lastErrors.set(label, error instanceof Error ? error.message : String(error));
              }
            }

            if (pending.size === 0) break;
            if (attempt < attempts) {
              console.log(
                `Waiting ${delayMs}ms for npm registry propagation before verification attempt ${attempt + 1}/${attempts}: ${[
                  ...pending.keys()
                ].join(", ")}`
              );
              await sleep(delayMs);
            }
          }

          if (pending.size > 0) {
            throw new Error(
              [
                `npm publish verification failed after ${attempts} attempts.`,
                ...[...pending.keys()].map((label) => `- ${label}: ${lastErrors.get(label) || "not visible"}`)
              ].join("\n")
            );
          }
          NODE
